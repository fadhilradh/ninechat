[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # NODE_VERSION alone sets the *build* image; the functions run on whatever
  # Lambda runtime Netlify defaults to unless this says otherwise. Older ones
  # have no global `crypto`, which Better Auth needs.
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # esbuild only follows imports, and the schema is read at runtime rather than
  # imported. Without this the deploy cannot create its own tables.
  included_files = ["netlify/lib/*.sql"]

# `netlify dev` runs Vite and the functions together on one origin, so the
# frontend can call /api/* in development exactly as it does in production.
[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# An unmatched /api/* path would otherwise fall through to the SPA rule below
# and return the app's HTML with a 200, so a client asking for a removed or
# mistyped endpoint gets a JSON parse error instead of a 404.
#
# Deliberately not `force`d: a non-forced rule only fires when nothing else
# matched, so the real function routes still win their own paths.
[[redirects]]
  from = "/api/*"
  to = "/api-404.json"
  status = 404

# SPA fallback. Must stay last so it does not shadow the function routes,
# which are declared with `config.path` inside each function.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
